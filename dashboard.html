<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Dashboard | Orlando Custom Tees</title>
<style>
:root{--navy:#091a35;--navy2:#10274c;--pink:#e83383;--ink:#15243a;--muted:#64748b;--line:#e4e9f1;--bg:#f5f7fb;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}button,a{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
#gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--navy)}.gate-card{max-width:470px;width:100%;padding:34px;border-radius:18px;background:white;text-align:center;box-shadow:0 18px 50px #0003}.gate-card img{width:230px;max-width:100%;height:auto}.gate-card h1{font-size:23px;color:var(--navy)}.gate-card p{color:var(--muted);line-height:1.65}.btn{border:0;background:var(--pink);color:#fff;padding:11px 18px;border-radius:9px;font-weight:700;display:inline-block}.btn.secondary{background:white;border:1px solid #d3dbe7;color:var(--navy)}.btn:focus-visible,.nav-btn:focus-visible{outline:3px solid #f9b0d3;outline-offset:2px}
#app[hidden],#gate[hidden]{display:none!important}#app{min-height:100vh;display:flex}
.sidebar{background:var(--navy);color:#dce6f8;width:260px;min-width:260px;padding:23px 13px;display:flex;flex-direction:column;gap:20px}.brand{padding:7px 12px 22px;border-bottom:1px solid #294060}.brand img{display:block;width:200px;max-width:100%;margin-bottom:9px;background:#fff;border-radius:7px;padding:8px}.brand .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#8eabdc}.brand strong{display:block;font-size:15px;line-height:1.5}.nav{display:grid;gap:4px}.nav-btn{display:flex;gap:12px;align-items:center;background:transparent;color:#dce6f8;border:0;border-radius:9px;text-align:left;width:100%;padding:13px 12px;font-size:14px}.nav-btn:hover{background:#1c3457}.nav-btn[aria-current="page"]{background:#e8338325;color:#fff;border-left:3px solid var(--pink);padding-left:9px}.nav-icon{width:20px;font-size:17px;text-align:center}.sidebar-foot{margin-top:auto;border-top:1px solid #294060;padding:17px 12px;color:#a9b9d1;font-size:12px;line-height:1.6}
.main{flex:1;min-width:0}.topbar{min-height:80px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 30px}.topbar .caption{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}.topbar h1{margin:4px 0 0;font-size:23px}.user-info{text-align:right;font-size:13px;color:var(--muted)}.user-info strong{display:block;color:var(--navy);font-size:14px}.content{padding:28px 30px;max-width:1350px;margin:0 auto}.hero{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:28px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px}.hero h2{font-size:25px;margin:5px 0 10px}.hero p{line-height:1.6;color:#d3ddf0;margin:0;max-width:680px}.pill{display:inline-block;border-radius:100px;padding:6px 10px;font-size:11px;font-weight:bold;letter-spacing:.5px}.pill.preview{background:#ffffff20;color:#fff}.pill.pending{background:#fdf1f7;color:#9c225a}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:20px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 12px #10274c05}.stat span{font-size:12px;color:var(--muted);display:block}.stat strong{display:block;font-size:25px;margin-top:12px}.stat small{display:block;color:var(--muted);margin-top:8px}.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel h3{font-size:16px;margin:0 0 13px}.panel p{color:var(--muted);font-size:14px;line-height:1.7}.module-items{display:grid;gap:9px}.module-item{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px}.module-item span{font-weight:600}.module-item small{color:var(--muted);text-align:right}.notice{border:1px solid #f0d4e3;background:#fff6fa;border-radius:11px;padding:17px 20px;color:#713451;line-height:1.6;font-size:13px;margin-top:18px}.section-head{margin:0 0 18px}.section-head h2{font-size:22px;margin:0 0 6px}.section-head p{margin:0;color:var(--muted);font-size:14px}.placeholder{margin-top:18px;min-height:270px;display:grid;place-items:center;text-align:center}.placeholder-icon{font-size:35px}.placeholder strong{display:block;font-size:20px;margin:13px 0}.placeholder p{max-width:500px;margin:0 auto;color:var(--muted);line-height:1.7}.footer-note{margin-top:25px;color:#7d899e;font-size:12px}
.mobile-nav{display:none}body.busy .btn{opacity:.7}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.sidebar{width:220px;min-width:220px}}
@media(max-width:720px){#app{display:block}.sidebar{display:none}.mobile-nav{display:flex;gap:7px;overflow-x:auto;background:var(--navy);padding:12px;position:sticky;top:0;z-index:5}.mobile-nav .nav-btn{white-space:nowrap;width:auto;padding:9px 13px}.mobile-nav .nav-btn[aria-current="page"]{padding-left:10px}.topbar{padding:19px}.topbar h1{font-size:20px}.user-info{font-size:11px}.user-info strong{max-width:150px;overflow:hidden;text-overflow:ellipsis}.content{padding:17px}.hero{padding:23px}.hero h2{font-size:21px}.stats{gap:10px}.stat{padding:15px}.stat strong{font-size:20px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<section id="gate" aria-live="polite"><div class="gate-card">
<img src="https://sr-lhama.github.io/oct/assets/images/logo-official.webp" alt="Orlando Custom Tees logo">
<h1 id="gateTitle">Checking administrator access...</h1>
<p id="gateMessage">Verifying your secure Supabase session and permissions.</p>
<a class="btn" id="gateLogin" href="login.html" hidden>Go to secure sign-in</a>
</div></section>
<div id="app" hidden>
<aside class="sidebar">
<div class="brand"><img src="https://sr-lhama.github.io/oct/assets/images/logo-official.webp" alt="Orlando Custom Tees"><span class="eyebrow">Management platform</span><strong>Orlando Custom Tees</strong></div>
<nav id="desktopNav" class="nav" aria-label="Administrative navigation"></nav>
<div class="sidebar-foot">Orlando, Florida<br>Protected admin preview<br><a href="https://sr-lhama.github.io/oct/" target="_blank" rel="noopener noreferrer">Visit main website ↗</a></div>
</aside>
<div class="main">
<div class="mobile-nav" id="mobileNav" aria-label="Mobile administrative navigation"></div>
<header class="topbar"><div><div class="caption">Orlando Custom Tees / Administration</div><h1 id="pageTitle">Overview</h1></div>
<div style="display:flex;gap:12px;align-items:center"><div class="user-info"><strong id="displayName"></strong><span id="displayEmail"></span></div><button class="btn secondary" id="logoutBtn" type="button">Sign out</button></div>
</header>
<main class="content" id="content" tabindex="-1"></main>
</div>
</div>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://xemugzorxsmzmuuiidgu.supabase.co";
const SUPABASE_PUBLIC_KEY="sb_publishable_CIXSDcMhMfy5Vj-ak0YkzQ_2kO7Fix5";
const pages=[
{id:"overview",label:"Overview",icon:"◫"},
{id:"estimates",label:"Estimates",icon:"▤"},
{id:"orders",label:"Orders",icon:"▣"},
{id:"customers",label:"Customers",icon:"♧"},
{id:"artwork",label:"Artwork approvals",icon:"✎"},
{id:"production",label:"Production",icon:"◷"},
{id:"payments",label:"Payments",icon:"＄"},
{id:"team",label:"Team",icon:"♙"},
{id:"settings",label:"Settings",icon:"⚙"}
];
const gate=document.getElementById("gate"),app=document.getElementById("app");
const client=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY,{auth:{flowType:"pkce"}});
let currentUser=null,profile=null;
const safe=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const moduleDesc={
estimates:["Estimates","Review customer quote requests, garment selections, pricing and approvals.","Estimate records will be connected after the existing ChatGPT Sites data is mapped and admin access policies are deployed."],
orders:["Orders","Manage confirmed orders and customer-facing order status.","Order listing is intentionally disabled until protected administrative access and migration are completed."],
customers:["Customers","Manage customer profiles and organization details.","Customer records remain protected. The upcoming backend must verify the admin role before serving them."],
artwork:["Artwork approvals","Review front and back designs and record approval events.","Artwork files require private storage access policies and controlled signed URLs."],
production:["Production","Monitor garment procurement, DTF transfers and 7–10 business day production windows.","We will preserve the current production workflow and introduce validated deadlines and status history."],
payments:["Payments","Track PayPal payment references, paid status and reconciliation.","Payment confirmation must come from verified PayPal webhooks, never from browser-side changes."],
team:["Team","Manage employee access and internal workflows.","Employee role assignment and administrative permissions will be implemented with protected server functions."],
settings:["Settings","Configure operational preferences and integrations.","SMTP credentials, PayPal secrets and service role keys must stay on protected server infrastructure."]
};
function nav(){
 const mark=(p)=>'<button type="button" class="nav-btn" data-page="'+p.id+'" '+(p.id==="overview"?'aria-current="page"':'')+'><span class="nav-icon" aria-hidden="true">'+p.icon+'</span>'+safe(p.label)+'</button>';
 document.getElementById("desktopNav").innerHTML=pages.map(mark).join("");
 document.getElementById("mobileNav").innerHTML=pages.map(mark).join("");
 document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));
}
function showPage(id){
 if(!pages.some(p=>p.id===id))id="overview";
 document.querySelectorAll("[data-page]").forEach(b=>b.setAttribute("aria-current",b.dataset.page===id?"page":"false"));
 document.getElementById("pageTitle").textContent=pages.find(p=>p.id===id).label;
 let content;
 if(id==="overview"){
 content='<section class="hero"><div><span class="pill preview">SECURE DEVELOPMENT PREVIEW</span><h2>Welcome, '+safe(profile.full_name||currentUser.email)+'</h2><p>Your administrative identity has been verified. Live read-only data is loaded through Supabase with row-level security. Changes remain disabled until the protected write layer is implemented.</p></div></section>'+
 '<div class="stats">'+["Active orders","Estimates awaiting review","Artwork approvals","Production deadlines"].map(k=>'<div class="stat"><span>'+k+'</span><strong>—</strong><small>Live reporting not connected</small></div>').join("")+'</div>'+
 '<div class="cols"><section class="panel"><h3>Commercial workflow</h3><div class="module-items">'+[
 ["Quote request","Customer selects products and uploads artwork"],
 ["Estimate & approval","Price reviewed, estimate sent, design approved"],
 ["Payment confirmation","PayPal confirmation verified before production"],
 ["Production & fulfillment","Garments, DTF, delivery and tracking"]
 ].map(x=>'<div class="module-item"><span>'+x[0]+'</span><small>'+x[1]+'</small></div>').join("")+'</div></section>'+
 '<section class="panel"><h3>Migration readiness</h3><div class="module-items">'+[
 ["Supabase Auth","Connected"],["Administrator identity","Verified"],["Customer RLS","Enabled for own data"],["Admin read permissions","Configured"],["Historical order migration","Pending"],["PayPal/Resend server integrations","Pending"]
 ].map(x=>'<div class="module-item"><span>'+x[0]+'</span><small>'+x[1]+'</small></div>').join("")+'</div></section></div>'+
 '<div class="notice"><strong>Data protection:</strong> This preview reads records with your authenticated Supabase session and RLS. It cannot edit payments, orders or customer data. The original ChatGPT Sites dashboard remains unchanged.</div>';
 }else{
 const d=moduleDesc[id];
 content='<div class="section-head"><h2>'+safe(d[0])+'</h2><p>'+safe(d[1])+'</p></div>'+
 '<section class="panel placeholder"><div><div class="placeholder-icon" aria-hidden="true">◫</div><strong>Module prepared</strong><p>'+safe(d[2])+'</p><p><span class="pill pending">Awaiting secure integration</span></p></div></section>';
 }
 document.getElementById("content").innerHTML=content+'<p class="footer-note">OCT Dashboard · Development environment · Read-only Supabase connection</p>';
 history.replaceState(null,"","#"+id);
 loadReadOnlyData(id);
}

let loadRevision=0;
const readConfigs={
 customers:{columns:[["name","Customer"],["company","Company"],["email","Email"],["phone","Phone"]],select:"id,name,company,email,phone,created_at",sort:"created_at"},
 estimates:{columns:[["estimate_number","Estimate"],["status","Status"],["total","Total (USD)"],["created_at","Created"]],select:"id,estimate_number,status,total,created_at",sort:"created_at"},
 orders:{columns:[["order_number","Order"],["status","Status"],["total","Total (USD)"],["due_date","Due date"],["created_at","Created"]],select:"id,order_number,status,total,due_date,created_at",sort:"created_at"}
};
const money=n=>typeof n==="number"?new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n):safe(n);
const printable=(k,v)=>v===null||v===undefined||v===""?"—":k==="total"?money(Number(v)):k.includes("_at")?safe(new Date(v).toLocaleDateString("en-US")):safe(v);
async function loadReadOnlyData(pageId){
 const revision=++loadRevision;
 if(pageId==="overview"){
  const specs=[
   {table:"orders",label:"Orders in Supabase"},
   {table:"estimates",label:"Estimates in Supabase"},
   {table:"customers",label:"Customers in Supabase"},
   {table:"artworks",label:"Artworks in Supabase"}
  ];
  const results=await Promise.all(specs.map(async spec=>{
   const {count,error}=await client.from(spec.table).select("id",{head:true,count:"exact"});
   return {...spec,count,error};
  }));
  if(revision!==loadRevision||location.hash!=="#overview")return;
  const stats=document.querySelector(".stats");
  if(!stats)return;
  stats.innerHTML=results.map(r=>'<div class="stat"><span>'+safe(r.label)+'</span><strong>'+ (r.error?"—":String(r.count??0))+'</strong><small>'+ (r.error?"Unable to load: "+safe(r.error.message):"Live, read-only Supabase data")+'</small></div>').join("");
  return;
 }
 const cfg=readConfigs[pageId];if(!cfg)return;
 const slot=document.querySelector("#content .placeholder");
 if(slot)slot.innerHTML='<div><strong>Loading live records...</strong><p>Reading your Supabase data with the administrator session.</p></div>';
 const {data,error}=await client.from(pageId).select(cfg.select).order(cfg.sort,{ascending:false}).limit(50);
 if(revision!==loadRevision||location.hash!=="#"+pageId)return;
 const target=document.querySelector("#content .placeholder");if(!target)return;
 target.classList.remove("placeholder");
 if(error){
  target.innerHTML='<h3>Unable to read records</h3><p>'+safe(error.message)+'</p>';
  return;
 }
 if(!data||data.length===0){
  target.innerHTML='<h3>No records in this Supabase table yet</h3><p>Your previous ChatGPT Sites orders have not been migrated. No sample data has been added.</p>';
  return;
 }
 const head=cfg.columns.map(c=>'<th scope="col">'+safe(c[1])+'</th>').join("");
 const rows=data.map(rec=>'<tr>'+cfg.columns.map(c=>'<td>'+printable(c[0],rec[c[0]])+'</td>').join("")+'</tr>').join("");
 target.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px"><h3 style="margin:0">Supabase records</h3><span class="pill pending">Read only · First 50</span></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;text-align:left;font-size:13px"><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
 target.querySelectorAll("th,td").forEach(el=>{el.style.padding="13px 10px";el.style.borderBottom="1px solid #e4e9f1"});
}

function showGate(title,detail,allowLogin){
 gate.hidden=false;app.hidden=true;
 document.getElementById("gateTitle").textContent=title;
 document.getElementById("gateMessage").textContent=detail;
 document.getElementById("gateLogin").hidden=!allowLogin;
}
async function start(){
 if(!client){showGate("Authentication is unavailable","The Supabase client library could not be loaded.",true);return;}
 try{
 const {data:userData,error:userErr}=await client.auth.getUser();
 if(userErr||!userData.user){showGate("Sign in required","Please sign in with your Orlando Custom Tees account to access administration.",true);return;}
 const {data:profileData,error:profileErr}=await client.from("profiles").select("full_name,role").eq("id",userData.user.id).single();
 if(profileErr||!profileData){showGate("Permission check failed","The administrator profile could not be verified. No business data has been loaded.",false);return;}
 if(profileData.role!=="admin"){showGate("Access restricted","This dashboard is reserved for authorized Orlando Custom Tees administrators.",false);return;}
 currentUser=userData.user;profile=profileData;
 document.getElementById("displayName").textContent=profile.full_name||"Administrator";
 document.getElementById("displayEmail").textContent=currentUser.email||"";
 nav();gate.hidden=true;app.hidden=false;
 showPage((location.hash||"#overview").slice(1));
 }catch(e){console.error("Admin gate error",e);showGate("Unable to verify access","Please try again or sign in again.",true);}
}
document.getElementById("logoutBtn").addEventListener("click",async()=>{document.body.classList.add("busy");try{await client.auth.signOut();location.replace("login.html");}finally{document.body.classList.remove("busy");}});
start();
})();
</script>
</body></html>
