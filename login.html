
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Orlando Custom Tees</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #091a35;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 38px 32px;
      text-align: center;
      box-shadow: 0 20px 60px #0003;
    }
    .logo {
      width: 210px;
      max-width: 100%;
      margin-bottom: 25px;
    }
    h1 { color: #091a35; font-size: 26px; }
    p { color: #64748b; line-height: 1.6; }
    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      margin: 16px 0;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #e83383;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { font-size: 14px; min-height: 24px; }
    .back {
      display: block;
      margin-top: 25px;
      color: #64748b;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="icon" href="/admin-icon.svg" type="image/svg+xml">
<link rel="icon" href="https://orlandocustomtees.com/assets/images/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="https://orlandocustomtees.com/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#091a35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OCT Admin">
</head>
<body>
  <main class="login-card">
    <img
      class="logo"
      src="https://sr-lhama.github.io/oct/assets/images/logo-official.webp"
      alt="Orlando Custom Tees"
    >

    <h1>Welcome Back</h1>
    <p>Sign in to your Orlando Custom Tees account.</p>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Your email address"
        autocomplete="email"
        required
      >
      <button id="submitBtn" type="submit">
        Send Sign-In Code or Link
      </button>
    </form>

    <form id="otpForm" hidden style="margin-top:16px">
      <label for="otp">Enter the verification code from your email</label>
      <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" maxlength="8" placeholder="00000000" required style="text-align:center;letter-spacing:6px;font-size:24px">
      <button id="verifyBtn" type="submit">Verify &amp; Sign In</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <a id="nextLink" href="dashboard.html" style="display:none;margin-top:14px;padding:14px;background:#e83383;color:white;text-decoration:none;border-radius:8px;font-size:14px;font-weight:bold">Continue</a>

    <a class="back" href="https://orlandocustomtees.com/">
      Back to Orlando Custom Tees
    </a>
  </main>

  <script>
    // Replace these values before testing.
    const SUPABASE_URL = "https://xemugzorxsmzmuuiidgu.supabase.co";
    const SUPABASE_PUBLIC_KEY = "sb_publishable_CIXSDcMhMfy5Vj-ak0YkzQ_2kO7Fix5";

    const message = document.getElementById("message");
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submitBtn");
    const otpForm = document.getElementById("otpForm");
    const verifyBtn = document.getElementById("verifyBtn");
    let requestedEmail = "";

    if (
      SUPABASE_URL.startsWith("YOUR_") ||
      SUPABASE_PUBLIC_KEY.startsWith("YOUR_")
    ) {
      message.textContent = "Authentication setup pending.";
      form.hidden = true;
    otpForm.hidden = true;
    } else {
      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLIC_KEY,
        { auth: { flowType: "pkce" } }
      );

    
async function initialize() {
  try {
    const { data: sessionData } = await client.auth.getSession();
    if (!sessionData.session) return;
    const { data, error } = await client.auth.getUser();

    if (error) {
      throw error;
    }

   
if (data.user) {
  const { data: profile, error: profileError } = await client
    .from("profiles")
    .select("role, full_name")
    .eq("id", data.user.id)
    .single();

  if (profileError) {
    console.error("Profile lookup error:", profileError);
    message.textContent =
      "Signed in, but unable to verify account permissions.";
    form.hidden = true;
    otpForm.hidden = true;
    return;
  }

  const canManageOrders = ["admin", "manager"].includes(profile.role);
  if (canManageOrders) {
    message.textContent =
      (profile.role === "admin" ? "Administrator" : "Manager") + " access confirmed. Welcome, " +
      (profile.full_name || data.user.email) + "!";
  } else {
    message.textContent =
      "Signed in successfully as " + data.user.email;
  }

  form.hidden = true;
    otpForm.hidden = true;
  const nextLink = document.getElementById("nextLink");
  nextLink.href = canManageOrders ? "dashboard.html" : "portal.html";
  nextLink.textContent = canManageOrders ? "Open Dashboard" : "Track My Orders";
  nextLink.style.display = "block";
}

  } catch (error) {
    console.error("Authentication error:", error);

    message.textContent =
      "Sign-in could not be completed. Please try again.";
  }
}
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        message.textContent = "Sending your secure sign-in email...";

        const email = document.getElementById("email").value.trim();
        otpForm.hidden = true;
        requestedEmail = "";

        try {
          const { error } = await client.auth.signInWithOtp({
            email,
            options: {
              shouldCreateUser: false,
              emailRedirectTo: new URL(
                "login.html", window.location.href
              ).href
            }
          });

          if (error) throw error;

          message.textContent =
            "Check your inbox. Enter the code below, or use the sign-in link in your email.";
          requestedEmail = email;
          otpForm.reset();
          otpForm.hidden = false;
          document.getElementById("otp").focus();
        } catch (error) {
          message.textContent =
            "Unable to send the sign-in email. Please try again.";
        } finally {
          button.disabled = false;
        }
      });

      otpForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!requestedEmail) return;
        const token = document.getElementById("otp").value.trim();
        if (!/^\d{6,8}$/.test(token)) return;
        verifyBtn.disabled = true;
        button.disabled = true;
        message.textContent = "Verifying your code...";
        try {
          const { error } = await client.auth.verifyOtp({ email: requestedEmail, token, type: "email" });
          if (error) throw error;
          otpForm.hidden = true;
          await initialize();
        } catch (error) {
          message.textContent = "Invalid or expired code. Try again or request a new email.";
        } finally {
          verifyBtn.disabled = false;
          button.disabled = false;
        }
      });
      initialize();
    }
  </script>
</body>
</html>
